name: Portfolio checks
on:
  pull_request:
    paths:
      - 'modern-portfolio/**'
      - '.github/workflows/portfolio-check.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modern-portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: modern-portfolio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:static
